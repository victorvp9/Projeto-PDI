[project]
name = "registro-campo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
# máscaras do 6c na GPU (src/gpu.py); sem este extra, o 6c roda na CPU com o mesmo resultado
gpu = [
    "cupy-cuda12x[ctk]>=14.2",
    "nvidia-cuda-runtime-cu12",   # cabeçalhos para o CuPy compilar os kernels
    "nvidia-cuda-nvrtc-cu12",     # compilador em tempo de execução
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: testes lentos; no dia a dia, pytest -m \"not slow\" (a suíte completa roda antes de cada commit)"]
